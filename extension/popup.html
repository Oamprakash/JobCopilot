<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Job application helper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/48.png" alt="" width="24" height="24" />
    <strong data-app-name></strong>
    <span id="who" class="muted"></span>
  </header>

  <section id="connect" hidden>
    <p class="muted">Connect to your <span data-app-name></span> account. In the app, open <b>Profile → Browser extension</b> and get a code.</p>
    <label>Connection code
      <input id="code" type="text" placeholder="ABCD2345" autocomplete="off" maxlength="12" />
    </label>
    <button id="pair" class="primary">Connect</button>
    <details class="advanced">
      <summary>Advanced</summary>
      <label>App address (only for a local development copy)
        <input id="baseUrl" type="url" placeholder="https://trulyapply.com" autocomplete="off" />
      </label>
    </details>
  </section>

  <section id="main" hidden>
    <div id="pageInfo" class="muted small"></div>
    <div id="pick" hidden>
      <label>Fill with
        <select id="pickApp"></select>
      </label>
    </div>
    <button id="fill" class="primary">Autofill this application</button>
    <p class="hint">Fills empty fields with your details, your tailored answers and resume. You review everything and click Submit yourself.</p>
    <div class="row">
      <button id="save">Save this job</button>
      <button id="applied" hidden>I submitted it</button>
    </div>
    <div class="row small">
      <a id="openTracker" href="#">Open tracker</a>
      <a id="disconnect" href="#" class="muted">Disconnect</a>
    </div>
  </section>

  <p id="message" role="status" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
