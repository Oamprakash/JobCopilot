name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Integration tests start Postgres with Testcontainers (Docker is available on ubuntu-latest).
      - run: ./gradlew test --no-daemon
      # Surface test counts as an annotation so they show on the run page without opening logs.
      - name: Summarize tests
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for path in glob.glob("build/test-results/test/*.xml"):
              r = ET.parse(path).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
              for case in r.iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      msg = (bad.get("message") or bad.text or "").strip().replace("\n", " ")[:400]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          print(f"::notice title=Backend tests::{t - f - e - s} passed, {f + e} failed, {s} skipped of {t}")
          EOF
      - run: ./gradlew buildFatJar --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node -e "const m=require('./manifest.json'); if (m.manifest_version!==3) process.exit(1)"
      - run: for f in background.js popup.js lib/match.js content/fill.js content/extract.js; do node --check "$f"; done
      - run: node --test test/*.test.js
      # The Chrome Web Store package: the extension without its tests.
      - run: zip -qr ../extension.zip . -x 'test/*' 'pack.ps1'
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension.zip

  # The Render image: build it, start it within the free plan's 512 MB, and check both halves answer.
  deploy-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: applycopilot
          POSTGRES_USER: applycopilot
          POSTGRES_PASSWORD: applycopilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U applycopilot" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/render.Dockerfile -t jobcopilot .
      - name: Start the container
        run: |
          docker run -d --name app --network host --memory 512m \
            -e PORT=10000 -e APP_ENV=preview -e PUBLIC_PREVIEW=true -e SCHEDULER_ENABLED=false \
            -e RENDER_EXTERNAL_URL=http://localhost:10000 \
            -e DATABASE_URL=postgresql://applycopilot:applycopilot@127.0.0.1:5432/applycopilot \
            -e JWT_SECRET=ci-only-secret-ci-only-secret-ci-only-secret \
            -e ADMIN_EMAILS=admin@example.com \
            jobcopilot
      - name: Smoke test
        run: |
          fail() { echo "::error title=Render image::$1"; exit 1; }
          for i in $(seq 1 90); do curl -fsS http://localhost:10000/api/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://localhost:10000/api/health | grep -q ok || fail "API health through the web app did not answer"
          curl -fsS http://localhost:10000/login | grep -q "TrulyApply" || fail "Login page did not render"
          curl -fsS http://localhost:10000/robots.txt | grep -q "Sitemap: https://trulyapply.com/sitemap.xml" || fail "robots.txt missing"
          curl -fsS http://localhost:10000/sitemap.xml | grep -q "<loc>https://trulyapply.com/</loc>" || fail "sitemap.xml missing"
          curl -fsS http://localhost:10000/ | grep -q 'property="og:image"' || fail "Home page has no link preview image"
          curl -fsS http://localhost:10000/ | grep -q 'application/ld+json' || fail "Home page has no structured data"
          curl -fsS http://localhost:10000/jobs | grep -q "Tech jobs in India" || fail "Job index page did not render"
          curl -fsS -o /dev/null http://localhost:10000/favicon.ico || fail "favicon.ico missing"
          curl -fsS -o /dev/null http://localhost:10000/logo-512.png || fail "logo-512.png missing"
          curl -fsS http://localhost:10000/ | grep -q 'rel="icon"' || fail "Home page has no icon links"
          curl -fsS http://localhost:10000/sitemap.xml | grep -q "<loc>https://trulyapply.com/jobs</loc>" || fail "sitemap.xml has no job pages"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/jobs/plumber-jobs-in-nowhere)" = "404" || fail "Unknown job page should be 404"
          code=$(curl -s -o /tmp/ml.json -w '%{http_code}' -X POST http://localhost:10000/api/auth/magic-link \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:10000' -d '{"email":"friend@example.com"}')
          test "$code" = 200 || fail "magic-link returned $code: $(head -c 300 /tmp/ml.json)"
          mem=$(docker stats --no-stream --format '{{.MemUsage}}' app)
          echo "::notice title=Render image::Started and answered; memory $mem"
      - name: Container logs
        if: always()
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}'
          # Logs as one annotation so they're readable without opening the job log.
          logs=$(docker logs app 2>&1 | grep -v "^\s*at " | tail -25 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::warning title=Container logs ($(docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' app))::$logs"
