name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Integration tests start Postgres with Testcontainers (Docker is available on ubuntu-latest).
      - run: ./gradlew test --no-daemon
      # Surface test counts as an annotation so they show on the run page without opening logs.
      - name: Summarize tests
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for path in glob.glob("build/test-results/test/*.xml"):
              r = ET.parse(path).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print(f"::notice title=Backend tests::{t - f - e - s} passed, {f + e} failed, {s} skipped of {t}")
          EOF
      - run: ./gradlew buildFatJar --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
