# Render Blueprint: dashboard.render.com → New → Blueprint → pick this repo.
# One free web service (API + web app in one container), in Singapore. The database is on Neon (free,
# Singapore): set DATABASE_URL to its connection string in the dashboard. See docs/launch.md.
services:
  - type: web
    name: jobcopilot
    runtime: docker
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      # The Neon connection string, set in the dashboard. sync: false keeps that value on Blueprint syncs.
      - key: DATABASE_URL
        sync: false
      # Set in the dashboard: "preview" (sign-in links also shown on screen) until Resend is set up, then "prod"
      # (links only emailed; the app won't start without RESEND_API_KEY). sync: false keeps the dashboard value.
      - key: APP_ENV
        sync: false
      - key: PUBLIC_PREVIEW
        value: "true"
      - key: SECURE_COOKIES
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: INVITE_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Launch settings (docs/launch.md). Blueprints only prompt for these when the service is first created;
      # on an existing service, add them under Environment in the dashboard.
      - key: APP_NAME
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
