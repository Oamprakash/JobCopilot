# Render Blueprint: dashboard.render.com → New → Blueprint → pick this repo.
# One free web service (API + web app in one container) and a free Postgres database, in Singapore.
services:
  - type: web
    name: jobcopilot
    runtime: docker
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobcopilot-db
          property: connectionString
      # Not "prod": there's no email service yet, so sign-in links are shown on screen,
      # limited to INVITE_EMAILS by the public preview mode.
      - key: APP_ENV
        value: preview
      - key: PUBLIC_PREVIEW
        value: "true"
      - key: SECURE_COOKIES
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: INVITE_EMAILS
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: jobcopilot-db
    plan: free
    region: singapore
    databaseName: applycopilot
    user: applycopilot
